		// definiendo el valor de un pixel //
		function drawPixel (x, y,hex) {
			var aux=parseInt(Math.round(parseFloat(centerx)+parseFloat((x-centerx))*Math.cos(grados)-parseFloat((500-y-centery))*Math.sin(grados)));
			y=500-parseInt(Math.round(parseFloat(centery)+parseFloat((500-y-centery))*Math.cos(grados)+parseFloat((x-centerx))*Math.sin(grados)));
			x=aux;
			if(x<canvas.width||x>=0||y<canvas.height||y>=0)
			{
				var colors = toRGB(hex);
				var r = colors[0], g = colors[1], b = colors[2];
   				var index = (x + y * canvas.width) * 4;
		    	canvasData.data[index + 0] = r;
   				canvasData.data[index + 1] = g;
   				canvasData.data[index + 2] = b;
   				canvasData.data[index + 3] = 255;
   			}
		}
		function toRGB(hex){
			var r = parseInt(hex.slice(1, 3), 16),
        	g = parseInt(hex.slice(3, 5), 16),
        	b = parseInt(hex.slice(5, 7), 16);
    	    return [r,g,b];
		}
		function toHex(r, g, b) {
 		   return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
		}
		function rectangulo(x,x1,y,y1)
		{			
			var qwe = document.getElementById("colores").value;
			canvasData = ctx.getImageData(0, 0, canvas.width, canvas.height);
			var aux;
			aux = x;
			x = Math.min(x,x1);
			x1 = Math.max(aux,x1);
			aux = y;
			y = Math.min(y,y1);
			y1 = Math.max(aux,y1);
			for(var i = x; i<x1; i++)
			{
				drawPixel(i,500-y,qwe);
				drawPixel(i,500-y1,qwe);
			}
			for(var i = y; i<y1; i++)
			{
				drawPixel(x,500-i,qwe);
				drawPixel(x1,500-i,qwe);
			}
			add=true;
			tipo=6;
			updateCanvas();

		}
		function rectanguloRelleno(x,x1,y,y1,white){	
			var aux;
			aux = x;
			x = Math.min(x,x1);
			x1 = Math.max(aux,x1);
			aux = y;
			y = Math.min(y,y1);
			y1 = Math.max(aux,y1);
			aux=0;
			//console.log(x+" "+x1+" "+y+" "+y1);

					canvasData = ctx.getImageData(0, 0, canvas.width, canvas.height);
			for(var i=x; i<=x1; i++)
			{
					for(var j=y;j<=y1;j++)
							drawPixel(i,500-j,(white?"#ffffff":document.getElementById("colores").value));
			}
			add=true; tipo=(white?8:7);
			updateCanvas();
		}
		function recta(x,x1,y,y1,imprimir,addd,tip){
			canvasData = ctx.getImageData(0, 0, canvas.width, canvas.height);
			var m = 1, xb = false, dy, dx, error;
			if(x-x1 != 0){
				m = (y-y1)/(x-x1);
				xb = m>=-1 && m<=1;
			}
			m = m / Math.abs(m);
			if(xb)
			{
				if(x1<x)
				{
					var aux = x;
					x = x1; x1 = aux; aux = y; y = y1; y1 = aux;
				}
				if(m==-1) y1 = y + y -y1;
				dy = y1 - y; dx = x1 - x; error = 2*dy-dx;
				for(var i = x; i<= x1; i++)
				{
					//if(imprimir) console.log((i-x)+": ("+i+","+y+") "+error);
					drawPixel(i,500-y,document.getElementById("colores").value);
					if(error>=0){
						y+=m;
						error+=2*dy-2*dx;
					}
					else
						error+=2*dy;
				}
			}
			else
			{
				if(y1<y)
				{
					var aux = x;
					x = x1; x1 = aux; aux = y; y = y1; y1 = aux;
				}
				if(m==-1) x1 = x + x -x1;
				dy = y1 - y; dx = x1 - x; error = 2*dx-dy;
				for(var i = y; i<= y1; i++)
				{
					//if(imprimir) console.log((i-y)+": ("+x+","+i+") "+error);
					drawPixel(x,500-i,document.getElementById("colores").value);
					if(error>=0){
						x+=m;
						error+=2*dx-2*dy;
					}
					else
						error+=2*dx;
				}
			}
			add=addd;
			tipo = tip
			updateCanvas();

		}
		function triangulo(x,x1,x2,y,y1,y2){
			recta(x,x1,y,y1,false,false);
			recta(x,x2,y,y2,false,false);
			recta(x1,x2,y1,y2,false,true,9);
		}
		function trianguloix(x,x1,x2,y,y1,y2){
			if(x<=x2&&x1<=x2){
				recta(2*x2-x,2*x2-x1,y,y1,false,false);
				recta(2*x2-x,x2,y,y2,false,false);
				recta(2*x2-x1,x2,y1,y2,false,true,10);
			}
			else
				if(x1<=x&&x2<=x)
				{
					recta(x,2*x-x1,y,y1,false,false);
					recta(x,2*x-x2,y,y2,false,false);
					recta(2*x-x1,2*x-x2,y1,y2,false,true,10);
				}
				else{
					recta(2*x1-x,x1,y,y1,false,false);
					recta(2*x1-x,2*x1-x2,y,y2,false,false);
					recta(x1,2*x1-x2,y1,y2,false,true,10);
				}
			
		}
		function trianguloiy(x,x1,x2,y,y1,y2){
			if(y>=y1&&y>=y2){
				recta(x,x1,y,2*y-y1,false,false);
			recta(x,x2,y,2*y-y2,false,false);
			recta(x1,x2,2*y-y1,2*y-y2,false,true,11);
			}
			else
				if(y1>=y&&y1>=y2){
					recta(x,x1,2*y1-y,y1,false,false);
			recta(x,x2,2*y1-y,2*y1-y2,false,false);
			recta(x1,x2,y1,2*y1-y2,false,true,11);
				}
				else
				{
					recta(x,x1,2*y2-y,2*y2-y1,false,false);
			recta(x,x2,2*y2-y,y2,false,false);
			recta(x1,x2,2*y2-y1,y2,false,true,11);
				}
		}
		function circulo(x,y,x1,imprimir,addd,tip){
			var qwe = document.getElementById("colores").value;
			canvasData = ctx.getImageData(0, 0, canvas.width, canvas.height);
			var y1 = 0, e = 0, c = 0;
			while(y1<=x1)
			{
				c++;
				/*if(imprimir){
					console.log(c+": ");
					console.log("("+(x+x1)+","+(y-y1)+") ");
					console.log("("+(x+x1)+","+(y+y1)+") ");
					console.log("("+(x-x1)+","+(y-y1)+") ");
					console.log("("+(x-x1)+","+(y+y1)+") ");
					console.log("("+(x-y1)+","+(y-x1)+") ");
					console.log("("+(x-y1)+","+(y+x1)+") ");
					console.log("("+(x+y1)+","+(y-x1)+") ");
					console.log("("+(x+y1)+","+(y+x1)+") ");
					console.log(e);
				}*/
				drawPixel(x+x1,500-y-y1,qwe);
				drawPixel(x+x1,500-y+y1,qwe);
				drawPixel(x-x1,500-y-y1,qwe);
				drawPixel(x-x1,500-y+y1,qwe);				
				drawPixel(x-y1,500-y-x1,qwe);
				drawPixel(x-y1,500-y+x1,qwe);
				drawPixel(x+y1,500-y-x1,qwe);
				drawPixel(x+y1,500-y+x1,qwe);
				e+=2*y1+1;
				y1++;
				if(2*e>2*x1-1)
				{
					x1--;
					e+=1-2*x1;
				}
			}
			add=addd;
			tipo = tip;
			updateCanvas();
		}
		function circuloRelleno1(x,y,x1){
			for(var i = 1; i<=x1; i++)
			{
				circulo(x,y,i,false,false,2);
			}
			add=true;
			updateCanvas();

		}
		function circuloRelleno2(x,y,x1){
			var y1 = 0, e = 0, c = 0, pe = Math.PI*x1/2;
			while(y1<=x1)
			{
				c++;
				recta(x+x1,x+x1,y+y1,y-y1,false,false);
				recta(x-x1,x-x1,y+y1,y-y1,false,false);				
				recta(x-y1,x-y1,y-x1,y+x1,false,false);
				recta(x+y1,x+y1,y-x1,y+x1,false,false);
				e+=2*y1+1;
				y1++;
				if(2*e>2*x1-1)
				{
					x1--;
					e+=1-2*x1;
				}
			}
			add=true; tipo=3;
			updateCanvas();

		}
		function circuloRelleno3(x,y,r)
		{
			/*
			function timeout(a)
			{
					setTimeout(function(){
						canvasData = ctx.getImageData(0, 0, canvas.width, canvas.height);
						for(var j = y-r; j<=y+r;j++)
							if((a-x)*(a-x)+(j-y)*(j-y)<=r*r)
								drawPixel(a,500-j,document.getElementById("colores").value);
						updateCanvas();
					},2000*(a-x+r)/(2*r));
			}
			for(var i=x-r;i<=x+r;i++)
				timeout(i);
			*/
			for(var i = -r;i<r;i++)
			{
				
				recta(x+i,x+i,y+parseInt(Math.sqrt(r*r-i*i)),y-parseInt(Math.sqrt(r*r-i*i)),false,false);
			}
			tipo=4;
			add=true;
			updateCanvas();
		}
		function draw(data){
			var col = document.getElementById('colores').value;
			console.log(data);
			document.getElementById('colores').value=data.color;
			canvasData = ctx.getImageData(0, 0, canvas.width, canvas.height);
			switch(data.tipo){
				case 1: circulo(data.x,data.y,data.r,false,true,1); break;
				case 2: circuloRelleno1(data.x,data.y,data.r);break;
				case 3: circuloRelleno2(data.x,data.y,data.r);break;
				case 4: circuloRelleno3(data.x,data.y,data.r);break;
				case 5: recta(data.x,data.x1,data.y,data.y1,false,true,5);break;
				case 6: rectangulo(data.x,data.x1,data.y,data.y1);break;
				case 7: rectanguloRelleno(data.x,data.x1,data.y,data.y1,false);break;
				case 8: rectanguloRelleno(data.x,data.x1,data.y,data.y1,true);break;
				case 9: triangulo(data.x,data.x1,data.x2,data.y,data.y1,data.y2,true);break;
				case 10: trianguloix(data.x,data.x1,data.x2,data.y,data.y1,data.y2,true);break;
				case 11: trianguloiy(data.x,data.x1,data.x2,data.y,data.y1,data.y2,true);break;
				case 12: clearCanvas();break;
				case 13: pinta=true; pintura=true; lap=true;pintar({clientX:data.xl,clientY:yl});pinta=false; pintura=false; lap=false;break;
				case 14: pinta=true; pintura=true; lap=false;pintar({clientX:data.xl,clientY:yl});pinta=false; pintura=false; lap=false;break;
				case 15: rellename(data.xl,data.yl);break;
			}
			document.getElementById('colores').value=col;
		}
		function updateCanvas(modi) {
    		ctx.putImageData(canvasData, 0, 0);
    		if(add){
    		if(historial.length>200) {historial.shift();ind--;}
    		if(!actu){
    			while(ind<historial.length-1)
    				historial.pop();
    			ind++;
    		}
    		 historial.push({img:canvasData,x:parseFloat(document.getElementById('X').value),y:parseFloat(document.getElementById('Y').value),x1:parseFloat(document.getElementById('X1').value),y1:parseFloat(document.getElementById('Y1').value),x2:parseFloat(document.getElementById('X2').value),y2:parseFloat(document.getElementById('Y2').value),r:parseFloat(document.getElementById('R').value),xl:parseFloat(xl),yl:parseFloat(yl),color:document.getElementById("colores").value,tipo:tipo});
    		actu=false;
    		console.log(ind);}
    		add=false;
			canvasData = ctx.getImageData(0, 0, canvas.width, canvas.height);
		}
		function undo(){
			if(historial.length>0&&ind>0){
				ind--;
			}
			canvasData=historial[ind].img;
			actu=true;
			add=true;
			updateCanvas();
			historial.pop();
		}
		function redo(){
			if(ind<historial.length-1)
				ind++;
			actu=true;
			add=true;
			draw(historial[ind]);
			historial.pop();
		}
		function trasladar(xx,yy,data){
			var dat = data;
			data.x+=xx;
			data.y+=yy;
			data.x1+=xx;
			data.y1+=yy;
			data.x2+=xx;
			data.y2+=yy;
			actu=true;
			add=true;
			undo();
			draw(data);
			historial.pop();
			data.img = ctx.getImageData(0, 0, canvas.width, canvas.height);
			historial.push(data);
		}
		function agrandar(mul,data){
			data.r=parseInt(data.r*mul);
			data.x1=parseInt(data.x+(data.x1-data.x)*mul);
			data.x2=parseInt(data.x+(data.x2-data.x)*mul);
			data.y1=parseInt(data.y+(data.y1-data.y)*mul);
			data.y2=parseInt(data.y+(data.y2-data.y)*mul);
			actu=true;
			add=true;
			undo();
			draw(data);
			historial.pop();
			data.img = ctx.getImageData(0, 0, canvas.width, canvas.height);
			historial.push(data);
		}
		function rotar(grados,data){
			grados = parseFloat(Math.PI*(parseFloat(grados)/180.0));
			this.grados = grados;
			this.centerx=data.x;
			this.centery=data.y;
			actu=true;
			add=true;
			undo();
			draw(data);
			var au=parseInt(Math.round(parseFloat(data.x)+parseFloat((data.x1-data.x))*Math.cos(grados)-parseFloat((data.y1-data.y))*Math.sin(grados)));
			data.y1=parseInt(Math.round(parseFloat(data.y)+parseFloat((data.y1-data.y))*Math.cos(grados)+parseFloat((data.x1-data.x))*Math.sin(grados)));
			data.x1=au;
			var aur=parseInt(Math.round(parseFloat(data.x)+parseFloat((data.x2-data.x))*Math.cos(grados)-parseFloat((data.y2-data.y))*Math.sin(grados)));
			data.y2=parseInt(Math.round(parseFloat(data.y)+parseFloat((data.y2-data.y))*Math.cos(grados)+parseFloat((data.x2-data.x))*Math.sin(grados)));
			data.x2=aur;
			centerx=0.0;
			centery=0.0;
			this.grados=0.0;
			historial.pop();
			data.img = ctx.getImageData(0, 0, canvas.width, canvas.height);
			historial.push(data);
		}
		function clearCanvas() {
			ctx.fillStyle="white";
			ctx.fillRect(0,0,500,500);
			canvasData = ctx.getImageData(0, 0, canvas.width, canvas.height);
			tipo=12;
			add=true;
			updateCanvas();
		}
		function pintar(event){
			var x = event.clientX;
			var y = event.clientY;
			if(pinta){
				if(cl){
					xm = x-11;
					ym = y-11;
					cl = false;
				}
				if(pintura) {
					if(lap){
						recta(xm,x-11,500-ym,500-y+11,false,true,13);
						xm = x-11;
						ym = y-11;
					}
					else
					{
						ctx.fillStyle = "white";
						ctx.fillRect(x-14,y-17,50,50);
						add=true;
						tipo=14;
					canvasData = ctx.getImageData(0, 0, canvas.width, canvas.height);
					updateCanvas();
					}
				}
			}
		}
		function activar(event){
			pintura = true;
			cl = true;
			if(relleno)
				{
					if(pintura){
						 rellename(event.clientX,event.clientY);
					}
				}
			else
				if(iluminame){
					iluminacion(event.clientX,event.clientY);
				}
		}
		function desactivar(){
			pintura = false;
		}
		function deshabilitar(){
			pinta = false;
			relleno = false;
			if(iluminame) iluminar();
			canvas.style.cursor = "default";
		}
		function borrador(){
			canvas.style.cursor = "url('img/borradorcursor.png'), default";
			lap = false;
			pinta = true;
			relleno = false;
			if(iluminame) iluminar();
		}
		function lapiz(){
			canvas.style.cursor = "url('img/lapizcursor.gif'), default";
			lap = true;
			pinta = true;
			relleno = false;
			if(iluminame) iluminar();
		}
		function iluminar(){
			console.log("ilu");
			iluminame=!iluminame;
			if(iluminame){
				canvasSave = document.getElementById('micanvas');
				document.getElementById("foco").src='img/focoe.jpg';
				relleno=false;
				lap=false;
				pinta=false;
				canvas.style.cursor = "default";
			}
			else{
				document.getElementById("foco").src='img/focoa.jpg';
				canvasData=historial[historial.length-1].img;
				add=false;
				updateCanvas();
			}
		}
		function rellenar()
		{
			canvas.style.cursor = "default";
			relleno = true;
			pinta = false;
			if(iluminame) iluminar();
			console.log(relleno);
		}
		function iluminacion(x,y){
			x-=15; y-=15;
			canvasData = ctx.getImageData(0, 0, canvas.width, canvas.height);
			var elem, dots = [],visited = new Array(500);
			for (var i = 0; i < 500; i++) {
  				visited[i] = new Array(500).fill(false);
			}
			var r,g,b,hex;
			dots.push({a: x, b: y,il:150,t:true});
			while(dots.length>0){
				elem = dots.shift();
				if(elem.a>=0&&elem.a<500&&elem.b>=0&&elem.b<500&&!visited[elem.a][elem.b])
				{
					visited[elem.a][elem.b] = true;
					ind = (elem.a + elem.b * canvas.width) * 4;
					r=canvasData.data[ind+0]+elem.il;
					r=r>255?255:r
					r=r<0?0:r
					g=canvasData.data[ind+1]+elem.il;
					g=g>255?255:g
					g=g<0?0:g;
					b=canvasData.data[ind+2]+elem.il;
					b=b<0?0:b;
					b=b>255?255:b;
					elem.il=elem.il<-150?-150:elem.il;
					hex=toHex(r,g,b);
					drawPixel(elem.a,elem.b,hex);
					dots.push({a:elem.a+1,b:elem.b,il:elem.il-(elem.t?1:0),t:!elem.t});
					dots.push({a:elem.a-1,b:elem.b,il:elem.il-(elem.t?1:0),t:!elem.t});
					dots.push({a:elem.a,b:elem.b+1,il:elem.il-(elem.t?1:0),t:!elem.t});
					dots.push({a:elem.a,b:elem.b-1,il:elem.il-(elem.t?1:0),t:!elem.t});
				}				
			}
			add=false;
			updateCanvas();
			
		}
		function rellename(x,y)
		{
			xl=x;
			yl=y;
			x-=15; y-=15;
			canvasData = ctx.getImageData(0, 0, canvas.width, canvas.height);
			var elem, dots = [],visited = new Array(500);
			for (var i = 0; i < 500; i++) {
  				visited[i] = new Array(500).fill(false);
			}
			var ind = (x + y * canvas.width) * 4, 
			r =	canvasData.data[ind + 0], 
			g =	canvasData.data[ind + 1], 
			b = canvasData.data[ind + 2],
			a = canvasData.data[ind + 3];
			console.log(r+" "+g+" "+b+" "+a);
			dots.push({a: x, b: y});
			while(dots.length>0){
				elem = dots.shift();
				if(elem.a>=0&&elem.a<500&&elem.b>=0&&elem.b<500&&!visited[elem.a][elem.b])
				{
					visited[elem.a][elem.b] = true;
					ind = (elem.a + elem.b * canvas.width) * 4;
					if(r==canvasData.data[ind+0]&&g==canvasData.data[ind+1]&&b==canvasData.data[ind+2]&&a==canvasData.data[ind+3])
					{
						drawPixel(elem.a,elem.b,document.getElementById('colores').value);
						dots.push({a:elem.a+1,b:elem.b});
						dots.push({a:elem.a-1,b:elem.b});
						dots.push({a:elem.a,b:elem.b+1});
						dots.push({a:elem.a,b:elem.b-1});
					}
				}				
			}
			add=true;
			tipo=15;
			updateCanvas();
			
		}
	</script>
